[project]
name = "getpoolcal"
version = "0.1.0"
description = "Fetch a PDF schedule from a web page and sync it into an Outlook.com calendar"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[project.scripts]
getpoolcal = "getpoolcal.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
